[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adgate"
version = "0.1.0"
description = "광고 소재 심사 파이프라인: 근거 인용이 붙은 반려 사유, 결정론적 판정, 수정안 재심사, 사전등록 평가 (합성 데이터)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
vision = ["pillow>=10"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "anthropic>=1.0",
  "pillow>=10",
  "fonttools>=4",
]

[project.scripts]
adgate = "adgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adgate = ["data/*.yaml", "data/*.md", "data/fonts/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/adgate"]
