<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>adgate · 광고 소재 심사</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>adgate <span class="sub">광고 소재 심사</span></h1>
      <p class="notice">모든 소재는 <b>합성 데이터</b>이고 정책은 <b>가상(v1)</b>입니다. 실제 심사 기준이나 법률 자문이 아닙니다.</p>
      <div class="who">
        <label>역할
          <select id="role">
            <option value="dev-advertiser">광고주 alice</option>
            <option value="dev-advertiser-2">광고주 carol</option>
            <option value="dev-reviewer">심사자 bob</option>
            <option value="custom">토큰 직접 입력</option>
          </select>
        </label>
        <input id="token" type="password" placeholder="Bearer 토큰" autocomplete="off" hidden>
        <span id="me" class="muted"></span>
      </div>
    </div>
  </header>

  <main class="wrap grid">
    <section class="card" aria-labelledby="h-compose">
      <h2 id="h-compose">소재 입력</h2>
      <label>예시 불러오기
        <select id="example"><option value="">직접 입력</option></select>
      </label>
      <div class="row">
        <label>업종
          <select id="category">
            <option value="app">앱·서비스</option><option value="ecommerce">쇼핑</option><option value="loan">대출</option>
            <option value="invest">투자</option><option value="supplement">건강기능식품</option><option value="cosmetic">화장품</option>
            <option value="education">교육</option><option value="general">기타</option><option value="adult">성인</option>
            <option value="gambling">사행성</option>
          </select>
        </label>
        <label class="check"><input id="verified" type="checkbox" checked> 사업자 인증 완료</label>
      </div>
      <label>제목 <input id="headline" maxlength="2000"></label>
      <label>본문 <textarea id="body" rows="3" maxlength="2000"></textarea></label>
      <label>CTA <input id="cta" maxlength="2000"></label>
      <label>고지 문구 <textarea id="disclosure" rows="2" maxlength="2000"></textarea></label>
      <label>이미지 속 글자 <input id="image_text" maxlength="2000"></label>
      <label>랜딩 페이지 텍스트 <textarea id="landing_text" rows="3" maxlength="20000"></textarea></label>
      <div class="actions">
        <button id="submit" class="primary" type="button">심사하기</button>
        <button id="clear" type="button">비우기</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="stack" aria-live="polite">
      <div id="queueBox" class="card" hidden>
        <div class="head"><h3 class="flush">검토 대기열</h3><button id="refreshQueue" type="button">새로고침</button></div>
        <ul id="queue" class="queue"></ul>
      </div>
      <div id="empty" class="card muted">왼쪽에서 소재를 입력하고 <b>심사하기</b>를 누르세요. 예시를 불러오면 바로 눌러 볼 수 있습니다.</div>
      <div id="result" class="card" hidden>
        <div class="head"><span id="badge" class="badge"></span><span id="state" class="muted"></span></div>
        <div id="fields"></div>
        <h3>사유</h3>
        <ul id="reasons" class="reasons"></ul>
        <div class="actions"><button id="rewrite" type="button">수정안 보기</button></div>
      </div>
      <div id="rewriteBox" class="card" hidden></div>
      <div id="reviewBox" class="card" hidden>
        <h3>사람 검토</h3>
        <p class="muted">자동으로 판정할 수 없는 건입니다. 자기가 제출한 건은 결정할 수 없습니다.</p>
        <div class="row">
          <label class="check"><input type="radio" name="verdict" value="APPROVE" checked> 승인</label>
          <label class="check"><input type="radio" name="verdict" value="REJECT"> 반려</label>
        </div>
        <label>사유 (5자 이상) <textarea id="reason" rows="2" maxlength="500"></textarea></label>
        <button id="resume" class="primary" type="button">결정 저장</button>
      </div>
      <div id="trace" class="card" hidden>
        <h3>처리 기록</h3>
        <ol id="events" class="events"></ol>
      </div>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
